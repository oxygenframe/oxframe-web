name: deploy-mcp
# mcp.oxframe.dev (services/mcp): a Worker with a service binding to
# oxframe-compile. The docs it serves come from the site at request time, so
# only code changes deploy.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - services/mcp/**
      - .github/workflows/deploy-mcp.yml
  workflow_dispatch:
concurrency: deploy-mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: services/mcp }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test && bunx tsc -p .
      - run: bunx wrangler deploy
