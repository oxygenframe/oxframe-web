name: release-media
# Copies each oxframe-sdk release video to R2 for /changelog
# (scripts/release-media.ts) and commits release-media.json, which deploys
# the site. The video is attached by the SDK's `release video` workflow some
# minutes after the tag, so this looks every three hours, first with a cheap
# check of the latest releases. Run by hand right after a release, or with
# versions whose video was made again.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      versions:
        description: Versions to copy again, e.g. "0.24.0 0.24.1"
        required: false
        default: ''
concurrency: release-media

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new: ${{ steps.new.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: apps/site/src/lib/release-media.json, sparse-checkout-cone-mode: false }
      - id: new
        run: |
          new=false
          for tag in $(gh release list -R oxygenframe/oxframe-sdk -L 5 --json tagName -q '.[].tagName'); do
            jq -e --arg v "${tag#v}" 'has($v)' apps/site/src/lib/release-media.json >/dev/null && continue
            if gh release view "$tag" -R oxygenframe/oxframe-sdk --json assets -q '.assets[].name' | grep -qx release.mp4; then
              echo "$tag has a video that is not on /changelog"
              new=true
            fi
          done
          echo "new=$new" >> "$GITHUB_OUTPUT"

  copy:
    needs: check
    if: needs.check.outputs.new == 'true' || inputs.versions != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: bun scripts/release-media.ts ${{ inputs.versions }}
      - name: Commit release-media.json
        run: |
          git diff --quiet apps/site/src/lib/release-media.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release-media: videos for /changelog' apps/site/src/lib/release-media.json
          git push
