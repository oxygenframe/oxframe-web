name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '41 2 * * *' # nightly cross-repo run against the latest SDK
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      # Editor e2e against the in-page mock engine + visual checks.
      - run: bun run e2e

  integration:
    # Site + real compile-service (local runner) + Rust; on main and nightly.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          {
            repository: oxygenframe/oxframe-sdk,
            path: oxframe-sdk,
            ref: "${{ github.event_name == 'schedule' && 'main' || '' }}",
          }
      # Scripts expect the SDK next to this repo (checkout cannot write there).
      - run: mv oxframe-sdk ../oxframe-sdk
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.97.1', targets: wasm32-unknown-unknown }
      - run: ./scripts/install-wasm-tools.sh
      - run: bun install --frozen-lockfile && bun run sync-examples && bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run --cwd apps/site e2e
      # Every Rust snippet on the site compiles against the published SDK.
      - run: bun run --cwd apps/site check-snippets

  sandbox-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The SDK the site documents, so the template's features exist in it.
      - run: |
          sdk=$(sed -n "s/^export const SDK_VERSION = '\\(.*\\)';/\\1/p" apps/site/src/lib/sdk.ts)
          test -n "$sdk"
          docker build -f infra/sandbox/Dockerfile --build-arg OXFRAME_SDK_VERSION="$sdk" -t oxframe-sandbox:ci .

  # Local-stack images: one executable each on a bare Alpine. They must
  # build, start and answer.
  stack-images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/site.Dockerfile -t oxframe-site:ci .
      - run: docker build -f infra/compile.Dockerfile -t oxframe-compile:ci .
      - name: Sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':ci'
      - name: Start and answer
        run: |
          docker run -d --name site -p 3000:3000 oxframe-site:ci
          docker run -d --name compile -p 8787:8787 oxframe-compile:ci
          for i in $(seq 30); do curl -sf localhost:3000/docs >/dev/null && curl -sf localhost:8787/healthz && break; sleep 1; done
          curl -sf localhost:3000/docs | grep -q '<title>'
          # The current series (from sdk.ts) redirects to /docs.
          series=$(grep -oE "[0-9]+\.[0-9]+" apps/site/src/lib/sdk.ts | head -1)
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:3000/docs/$series")" = 301
          curl -sf localhost:8787/api/examples | grep -q '"name":"intro"'
          docker logs site; docker logs compile

  # Links to other sites, nightly only (they change without a commit here).
  # Links inside the site are checked by e2e; archived docs and sites that
  # refuse bots are left out.
  links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile && bun run build
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress --root-dir ${{ github.workspace }}/apps/site/build --exclude '^file://'
            --exclude-path 'apps/site/build/docs/0\.'
            --accept '200..=299,429' --max-concurrency 16
            --exclude '^https?://(localhost|127\.0\.0\.1)' --exclude '^https://oxframe\.dev'
            --exclude '^https://(www\.)?(x|twitter|linkedin|npmjs)\.com'
            'apps/site/build/**/*.html'

  nightly-issue:
    if: failure() && github.event_name == 'schedule'
    needs: [web, integration, links]
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly cross-repo run failed" --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env: { GH_TOKEN: '${{ github.token }}' }
