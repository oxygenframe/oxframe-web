name: deploy-compile
# compile.oxframe.dev (services/compile-cf). The build-container image (Rust
# toolchain + a pre-compiled SDK) is built here, where there is time and a
# layer cache, pushed to the Cloudflare registry under its content hash
# (BUILD_ID), and the Worker is deployed pointing at it. Unchanged image
# inputs skip the image build entirely.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - services/compile/src/**
      - services/compile/package.json
      - services/compile-cf/**
      - infra/sandbox/template/**
      - apps/site/src/lib/sdk.ts
      - .dockerignore
      - apps/site/src/lib/examples/**
      - .github/workflows/deploy-compile.yml
  workflow_dispatch:
concurrency: deploy-compile

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  IMAGE: oxframe-compile-builder

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run: { working-directory: services/compile-cf }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run gen && bun test

      - name: Image tag
        id: image
        run: |
          tag=$(bun -e "import { BUILD_ID } from './src/examples.gen'; console.log(BUILD_ID)")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The tag is a content hash, so finding it anywhere in the listing is enough.
          if bunx wrangler containers images list --filter "$IMAGE" --json | grep -q "$tag"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "image $IMAGE:$tag is already in the registry"
          fi

      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/compile-cf/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push image to the Cloudflare registry
        if: steps.image.outputs.exists != 'true'
        run: bunx wrangler containers push "$IMAGE:${{ steps.image.outputs.tag }}"

      - name: Deploy the Worker
        run: bun scripts/deploy-config.ts && bunx wrangler deploy -c wrangler.deploy.json
