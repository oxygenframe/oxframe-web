name: deploy-compile
# compile.oxframe.dev: Worker + build container image (Cloudflare Containers).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Fallback for deploys from GitHub Actions; normally Cloudflare Workers Builds
# deploys this Worker from the repository (see services/compile-cf/wrangler.jsonc).
on:
  workflow_dispatch:
concurrency: deploy-compile

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
      - run: bun run --cwd services/compile-cf gen && bun test --cwd services/compile-cf
      - name: Deploy (builds the image with Docker, pushes it, rolls out)
        working-directory: services/compile-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
