<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #141414; }
      #root {
        width: 100%; height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; color: white; font-family: sans-serif;
      }
      #card { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #title { font-size: 96px; opacity: 0; transform: translateY(60px); }
      #line { font-size: 40px; opacity: 0; }
    </style>
  </head>
  <body>
    <!-- The Remotion "Release 2.0" scene from /docs/migrate/remotion, as HTML. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <h1 id="title">Release 2.0</h1>
        <p id="line">0% faster builds</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to('#title', { opacity: 1, duration: 0.66, ease: 'none' }, 0);
      tl.to('#title', { y: 0, duration: 0.8, ease: 'back.out(1.7)' }, 0);
      tl.set('#line', { opacity: 1 }, 1);
      const percent = { v: 0 };
      tl.to(percent, {
        v: 100, duration: 2, ease: 'none',
        onUpdate: () => (document.getElementById('line').textContent = `${Math.round(percent.v)}% faster builds`),
      }, 1);
      tl.to({}, { duration: 1 }, 3);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
